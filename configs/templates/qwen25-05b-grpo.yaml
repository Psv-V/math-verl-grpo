# Planning template only. Copy this file to configs/runs/<run-name>.yaml and
# replace every TBD value after the server audit and pilot. A file containing
# TBD values must never be used for a formal run.

run:
  name: TBD
  git_commit: TBD
  seed: TBD
  condition: TBD  # correctness_plus_format or correctness_only

model:
  repository: Qwen/Qwen2.5-0.5B-Instruct
  revision: TBD-AUDIT
  local_path: TBD-SERVER

data:
  train_file: TBD-SERVER
  dev_file: TBD-SERVER
  test_file: null  # never pass the official test split to the trainer
  dataset_revision: 740312add88f781978c0658806c59bc2815b9866

prompt:
  template_version: TBD-AUDIT
  max_prompt_length: 512  # RTX 5090 pilot candidate
  max_response_length: 512  # RTX 5090 pilot candidate

reward:
  correctness_weight: 1.0
  format_weight: TBD-CONDITION  # 0.1 for format; 0.0 for correctness-only

grpo:
  total_optimizer_steps: TBD-PILOT
  rollout_group_size: 8  # formal candidate; pilot starts at 4
  rollout_temperature: 1.0
  train_batch_size: 32  # prompts per step
  mini_batch_size: 64  # generated trajectories
  max_tokens_per_gpu: 12288  # dynamic micro-batching
  learning_rate: 1.0e-6
  kl_coefficient: 0.001

checkpointing:
  output_dir: TBD-SERVER
  save_interval: TBD-PILOT
  validation_interval: TBD-PILOT
  resume_from: null

tracking:
  logger: [console, swanlab]
  swanlab_project: math-verl-grpo
  swanlab_experiment_name: TBD
  swanlab_run_id: null
